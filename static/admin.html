<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZAYQORA Platform Admin</title>
<link rel="stylesheet" href="/styles.css">
<style>main{max-width:980px}</style>
</head>
<body>
<header><span class="logo">ZAYQORA · PLATFORM ADMIN</span><button class="link" id="logout" hidden>Log out</button></header>
<main>
  <div class="card" id="login-card" style="max-width:480px;margin:0 auto">
    <h1>Platform admin login</h1>
    <form id="login-form">
      <label for="email">Email</label><input id="email" type="email" required>
      <label for="password">Password</label><input id="password" type="password" required>
      <button type="submit">Log in</button>
      <div class="err" id="login-err"></div>
    </form>
  </div>
  <div id="panel" class="hidden">
    <div class="card">
      <h2>Restaurants</h2>
      <div id="tenants"></div>
      <div class="err" id="tenant-err"></div>
    </div>
    <div class="card">
      <h2>Audit log</h2>
      <div id="audit"></div>
      <button type="button" class="small" id="audit-refresh" style="margin-top:12px">Refresh</button>
    </div>
  </div>
</main>
<script src="/admin.js"></script>
</body>
</html>
